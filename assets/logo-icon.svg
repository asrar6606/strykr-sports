<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 210" fill="none">
  <defs>
    <filter id="favicon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g stroke="#C8D92B" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10" fill="none" filter="url(#favicon-glow)">
    <!-- Upper Polygon Loop -->
    <polygon points="128,10 128,54 65,80 65,116 12,90 12,46" />
    <!-- Lower Polygon Loop -->
    <polygon points="65,80 128,110 128,154 12,200 12,156 65,130" />
  </g>
</svg>
