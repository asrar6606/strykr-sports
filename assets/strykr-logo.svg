<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 135" width="100%" height="100%">
  <defs>
    <filter id="neon-glow-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- STRYKR 'S' Geometric Monogram Icon -->
  <g transform="translate(10, 8) scale(0.52)" stroke="#C8D92B" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10" fill="none" filter="url(#neon-glow-logo)">
    <!-- Upper Polygon Loop -->
    <polygon points="128,10 128,54 65,80 65,116 12,90 12,46" />
    <!-- Lower Polygon Loop -->
    <polygon points="65,80 128,110 128,154 12,200 12,156 65,130" />
  </g>

  <!-- Brand Text: STRYKR SPORTS -->
  <text x="110" y="64" font-family="'Gotham', 'Montserrat', sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="4">STRYKR</text>
  <text x="112" y="105" font-family="'Gotham', 'Montserrat', sans-serif" font-size="31" font-weight="800" fill="#C8D92B" letter-spacing="12">SPORTS</text>
</svg>
